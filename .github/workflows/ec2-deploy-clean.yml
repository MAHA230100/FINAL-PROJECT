name: Clean Deploy to EC2 (Full Rebuild)

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  clean-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Fix data directory permissions
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} bash << 'ENDPERM'
            echo "🔧 Ensuring project directory exists and has correct ownership..."
            sudo mkdir -p ${{ secrets.PROJECT_DIR }}
            sudo chown ${{ secrets.EC2_USERNAME }}:${{ secrets.EC2_USERNAME }} ${{ secrets.PROJECT_DIR }}
            
            cd ${{ secrets.PROJECT_DIR }}
            if [ -d "data" ]; then
              echo "🔧 Resetting data directory permissions..."
              sudo chown -R ${{ secrets.EC2_USERNAME }}:${{ secrets.EC2_USERNAME }} data/
              sudo chmod -R 775 data/
            fi
            echo "✅ Permissions fixed"
          ENDPERM

      - name: Copy code to EC2
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            --rsync-path="sudo rsync" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.idea' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '*.pyd' \
            --exclude '.env' \
            --exclude 'venv/' \
            --exclude 'env/' \
            --exclude '.venv/' \
            --exclude 'node_modules/' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            --exclude 'Thumbs.db' \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${{ secrets.PROJECT_DIR }}

      - name: Deploy using Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            PROJECT_DIR=${{ secrets.PROJECT_DIR }}

            # Ensure Docker is installed
            if ! command -v docker >/dev/null 2>&1; then
              echo "🛠 Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
              sudo usermod -aG docker $USER
            fi

            # Ensure Docker Compose is installed
            if ! command -v docker-compose >/dev/null 2>&1; then
              echo "🛠 Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # Navigate to project root (where docker-compose.yml is located)
            echo "📁 Navigating to project directory: $PROJECT_DIR"
            cd $PROJECT_DIR
            pwd
            ls -la

            # Clean up Docker to free up disk space
            echo "🧹 Cleaning up Docker system..."
            docker system prune -af
            docker volume prune -f
            docker builder prune -af
            
            # Check disk space
            echo "💾 Disk space after cleanup:"
            df -h

            # Create data directory and .env file
            echo "🔐 Setting up environment variables in data/.env..."
            sudo mkdir -p data
            sudo rm -f data/.env
            echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" | sudo tee data/.env > /dev/null
            echo "API_BASE_URL=http://localhost:8000" | sudo tee -a data/.env > /dev/null
            sudo chown ${{ secrets.EC2_USERNAME }}:${{ secrets.EC2_USERNAME }} data/.env
            sudo chmod 600 data/.env
            echo "✅ data/.env created"

            # Create root .env file
            echo "🔐 Setting up environment variables in root .env..."
            sudo rm -f .env
            echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" | sudo tee .env > /dev/null
            echo "API_BASE_URL=http://localhost:8000" | sudo tee -a .env > /dev/null
            sudo chown ${{ secrets.EC2_USERNAME }}:${{ secrets.EC2_USERNAME }} .env
            sudo chmod 600 .env
            echo "✅ root .env created"

            # Export variables for this session
            export GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}"
            export API_BASE_URL="http://localhost:8000"

            # Build and start containers in production mode with clean build
            echo "🚀 Building and starting production containers (clean build)..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans
            # Force clean build with --no-cache and pull latest base images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache --pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 120  # Increased from 30s to 120s to allow API to fully start

            # Check if services are running
            echo "🔍 Checking container status..."
            docker compose ps

            # Get detailed container information
            echo "🔍 Container details:"
            docker inspect $(docker ps -aq) | jq -r '.[] | "\(.Name) - \(.State.Health.Status) - \(.State.Status)"'

            # Check API health directly
            echo "🔍 Checking API health endpoint..."
            curl -v http://localhost:8000/health || echo "Health check failed"

            # Check API logs
            echo "📜 API container logs:"
            docker compose logs --tail 100 api

            # Check for any errors in the logs
            echo "⚠️  Checking for errors in logs..."
            docker compose logs --tail 1000 | grep -i error || echo "No errors found in logs"

            # Optional: prune unused images to save space
            docker system prune -f
          EOF
