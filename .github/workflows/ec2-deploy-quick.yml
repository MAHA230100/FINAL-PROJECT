name: Quick Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: true
        default: 'Quick deployment of latest changes'
      env_api_key:
        description: 'Select Google API Key'
        required: true
        default: 'GOOGLE_API_KEY'
        type: choice
        options:
          - GOOGLE_API_KEY
          - GOOGLE_API_KEY_01
          - GOOGLE_API_KEY_02
          - GOOGLE_API_KEY_03

jobs:
  quick-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # - name: Debug key format
      #   run: |
      #     echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/key
      #     chmod 600 /tmp/key
      #     file /tmp/key
      #     ssh-keygen -y -f /tmp/key
      #     ssh-add -l
      - name: Verify remote user
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "whoami && sudo whoami"

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Fix data directory permissions
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} bash << ENDPERM
            echo "🔧 Ensuring project directory exists and has correct ownership..."
            sudo mkdir -p ${{ secrets.PROJECT_DIR }}
            sudo chown ${{ secrets.EC2_USERNAME }}:${{ secrets.EC2_USERNAME }} ${{ secrets.PROJECT_DIR }}
            
            cd ${{ secrets.PROJECT_DIR }}
            if [ -d "data" ]; then
              echo "🔧 Resetting data directory permissions..."
              sudo chown -R ${{ secrets.EC2_USERNAME }}:${{ secrets.EC2_USERNAME }} data/
              sudo chmod -R 775 data/
            fi
            echo "✅ Permissions fixed"
          ENDPERM

      - name: Copy code to EC2
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
            --rsync-path="sudo rsync" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.idea' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '*.pyd' \
            --exclude '.env' \
            --exclude 'venv/' \
            --exclude 'env/' \
            --exclude '.venv/' \
            --exclude 'node_modules/' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            --exclude 'Thumbs.db' \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${{ secrets.PROJECT_DIR }}

      - name: Quick Deploy
        env:
          SELECTED_API_KEY: ${{ secrets[github.event.inputs.env_api_key] }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} bash << ENDSSH
            set -e
            PROJECT_DIR=${{ secrets.PROJECT_DIR }}
            cd \$PROJECT_DIR
            
            echo "🚀 Starting quick deployment..."
            echo "📍 Using API Key Environment: ${{ github.event.inputs.env_api_key }}"
            
            # Create data directory if it doesn't exist
            mkdir -p data
            
            # Create .env file in data directory
            echo "🔐 Setting up environment variables in data/.env..."
            echo "GOOGLE_API_KEY=$SELECTED_API_KEY" > data/.env
            echo "API_BASE_URL=http://localhost:8000" >> data/.env
            chmod 600 data/.env
            echo "✅ data/.env created"
            
            # Create .env file in root directory (for backup/safety)
            echo "🔐 Setting up environment variables in root .env..."
            echo "GOOGLE_API_KEY=$SELECTED_API_KEY" > .env
            echo "API_BASE_URL=http://localhost:8000" >> .env
            chmod 600 .env
            echo "✅ root .env created"
            
            # Export environment variable for this session
            export GOOGLE_API_KEY="$SELECTED_API_KEY"
            export API_BASE_URL="http://localhost:8000"
            
            # Stop and recreate containers
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            # Check container status
            echo "🔍 Checking container status..."
            docker compose ps
            
            # Show recent logs
            echo "📜 Showing recent logs..."
            docker compose logs --tail 20
          ENDSSH
